complexity:
  active: true
  TooManyFunctions:
    active: true
    threshold: 20
  LargeClass:
    active: true
    threshold: 600

# Global excludes for generated code
build:
  # Exclude generated code from analysis
  excludes:
    - '**/build/**'
    - '**/generated/**'

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '.*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    # Exclude backing properties from naming rules
    excludeClassPattern: '.*'

formatting:
  active: true
  android: true
  autoCorrect: true
